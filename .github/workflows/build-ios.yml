name: Build NOVA Studio

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project NOVAStudio.xcodeproj \
            -scheme NOVAStudio \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NOVAStudio.app Payload/
          zip -r NOVAStudio-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NOVAStudio-unsigned-IPA
          path: NOVAStudio-unsigned.ipa
